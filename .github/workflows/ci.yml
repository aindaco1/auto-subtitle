name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.7'
          python-version: '3.11'
      - run: npm test
      - run: uv run --no-project --python 3.11 --with pytest --with-requirements requirements-sync.lock python -m pytest -q
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select stable Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.3"
      - name: Build pinned local Whisper runtime
        run: bash scripts/build-whisper.sh
      - run: swift test --package-path macos
      - run: swift build --package-path speech-sidecar -c release --product auto-subtitle-speech
      - name: Verify generated model manifest
        run: |
          speech-sidecar/.build/release/auto-subtitle-speech manifest > /tmp/parakeet-v3.json
          python3 -c 'import json; assert json.load(open("/tmp/parakeet-v3.json")) == json.load(open("resources/model-manifests/parakeet-v3.json"))'
