name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify shared desktop dependency contract
        run: node shared/dust-wave-platform/scripts/check-desktop-consumer.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.7'
          python-version: '3.11'
      - run: npm test
      - run: npm run test:quality
      - run: uv run --no-project --python 3.11 --with pytest --with-requirements requirements-sync.lock python -m pytest -q
  macos:
    name: ${{ matrix.os == 'macos-15' && 'macos' || 'Xcode 27 compatibility' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, xcode-27]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify shared desktop dependency contract
        run: node shared/dust-wave-platform/scripts/check-desktop-consumer.mjs
      - name: Select stable Xcode
        if: matrix.os == 'macos-15'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          test "${xcode_version%%$'\n'*}" = "Xcode 26.3"
      - name: Record host and toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --show-sdk-version
          if [[ "${{ matrix.os }}" == "xcode-27" ]]; then
            xcode_version="$(xcodebuild -version)"
            xcode_first_line="${xcode_version%%$'\n'*}"
            [[ "$xcode_first_line" == "Xcode 27" || "$xcode_first_line" == "Xcode 27."* || "$xcode_first_line" == "Xcode 27 "* ]]
          fi

      - name: Build pinned local Whisper runtime
        run: bash scripts/build-whisper.sh
      - run: swift test --package-path macos
      - name: Build the Apple formatting helper and shared adapter
        run: swift build --package-path formatting-sidecar --product auto-subtitle-format
      - run: swift build --package-path speech-sidecar -c release --product auto-subtitle-speech
      - name: Verify generated model manifest
        run: |
          speech-sidecar/.build/release/auto-subtitle-speech manifest > /tmp/parakeet-v3.json
          python3 -c 'import json; assert json.load(open("/tmp/parakeet-v3.json")) == json.load(open("resources/model-manifests/parakeet-v3.json"))'
